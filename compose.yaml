# Bottleneck Playground — ambiente local de desenvolvimento (Laravel Sail).
# Gerado a partir dos stubs do laravel/sail @ a7174a143ca3ffa986c847bcf6a76725fcf66924
# (equivalente a `artisan sail:install --with=pgsql,redis --php=8.5`), com ajustes locais:
#   - nome de projeto fixo, portas publicadas só em 127.0.0.1;
#   - imagens de PostgreSQL/Redis com tag concreta (sem tag flutuante);
#   - laravel.test só sobe depois de pgsql/redis saudáveis.
# NÃO é configuração de produção. Documentação: https://laravel.com/docs/sail
name: bottleneck-playground

services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: bottleneck-playground/app:php8.5
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '127.0.0.1:${APP_PORT:-8000}:80'
            - '127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy

    pgsql:
        # Tag oficial listada em docker-library/official-images @ 13dfdd8 (23/09/2026).
        image: 'postgres:18.6-alpine'
        ports:
            - '127.0.0.1:${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            # Cria o banco `testing` no primeiro boot de um volume novo (usado pelo phpunit.xml).
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'pg_isready', '-q', '-d', '${DB_DATABASE}', '-U', '${DB_USERNAME}']
            retries: 3
            timeout: 5s

    redis:
        # Tag oficial listada em docker-library/official-images @ 13dfdd8 (23/09/2026).
        image: 'redis:8.10.2-alpine'
        ports:
            - '127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 3
            timeout: 5s

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
